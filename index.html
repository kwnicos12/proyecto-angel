<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login Kario Media</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="center-screen">
        <div class="card">
            <div class="logo-placeholder">LOGO</div>
            
            <h2>Bienvenido al panel digital de<br>KARIO Media</h2>
            <p>Por favor ingresa los siguientes datos para ingresar a la plataforma</p>

            <form>
                <label hidden for="user">Usuario</label>
                <input type="text" id="user" placeholder="Usuario">
                
                <label hidden for="pass">Contraseña</label>
                <input type="password" id="pass" placeholder="Contraseña">

                <a href="welcome.html" class="btn-orange">Ingresar al panel</a>
            </form>
            
            <br>
            <small style="color:#aaa;">¿Tienes problemas para ingresar? Contacta a soporte.</small>
        </div>
    </div>
</body>
</html>
